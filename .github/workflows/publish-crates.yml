# Publishes the crate to crates.io with trusted publishing. The release
# workflow that dist generates calls this after it creates the GitHub
# Release. Tags do not publish to crates.io by default: the job below is
# skipped unless the repository variable PUBLISH_CRATES is true, and the
# release workflow treats a skipped publish job as done. To turn publishing
# on, set PUBLISH_CRATES to true (Settings, Secrets and variables, Actions,
# Variables) and register the trusted publisher on crates.io. crates.io
# matches the calling workflow, so the trusted publisher names release.yml,
# not this file.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      # dist passes its release plan to every custom publish job.
      plan:
        required: true
        type: string

jobs:
  publish:
    # Off unless a maintainer sets the repository variable to true.
    if: vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      # The first version is published by hand, so a version that is already
      # on crates.io ends the job without failing it.
      - name: Check crates.io for this version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "vibelight") | .version')"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent 'vibelight-release (https://github.com/cppalliance/vibelight)' \
            "https://crates.io/api/v1/crates/vibelight/$version")"
          case "$status" in
            200)
              echo "vibelight $version is already on crates.io; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "crates.io answered HTTP $status for vibelight $version."
              exit 1
              ;;
          esac

      - name: Authenticate with crates.io
        if: steps.version.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
